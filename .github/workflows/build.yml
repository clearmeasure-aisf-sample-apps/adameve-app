# The integration build. It runs the private build and nothing else, so what is released is what a desk can build:
# pwsh ./PrivateBuild.ps1. After a green run on master the system's workflow release.yml makes the Octopus package
# from the artifact deploy-package and pushes the image of the artifact container-image to the system's registry;
# nothing is built a second time.
#
# What release.yml and the kit rely on:
#   - the name "Build";
#   - MAJOR_VERSION and MINOR_VERSION below: the version is MAJOR_VERSION.MINOR_VERSION.<run number>;
#   - the artifact container-image: container-image.tar.gz, a gzip of an archive "docker load" reads, which holds
#     the image container-image:<version>;
#   - the artifact deploy-package: deploy.ps1 and verify.ps1 at its root;
#   - the job "Build result", which needs every other job and is the one required check.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Integration build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out, with the history the build facts count
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: .NET SDK of global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Private build
        shell: pwsh
        run: ./PrivateBuild.ps1 -CI -Version "$env:MAJOR_VERSION.$env:MINOR_VERSION.$env:GITHUB_RUN_NUMBER"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: build/deploy-package/**
          if-no-files-found: error

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: build/container-image/container-image.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn

  build-result:
    name: Build result
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The integration build succeeded
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "Integration build: $RESULT"
          test "$RESULT" = "success"
